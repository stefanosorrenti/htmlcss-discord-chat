<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Chat</title>

    <!--Style-->

    <link rel="stylesheet" href="./css/style.css">

    <!--Bootsttap Icon-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="layouts">
        <div class="sidebar">

            <!--Server List-->

            <div class="server-icons">
                <img src="./img/logo.webp" alt="">
            </div>

            <div class="server-icons">
                <img src="./img/server arte.png" alt="">
            </div>
            <div class="server-icons">
                <img src="./img/server_boolean.png" alt="">
            </div>
            <div class="server-icons">
                <img src="./img/server_italia.png" alt="">
            </div>
            <div class="server-icons">
                <img src="./img/server_nintendo.png" alt="">
            </div>
            <div class="server-icons">
                <img src="./img/server_javascript.png" alt="">
            </div>
            <div class="server-icons">
                <img src="./img/server_pokemon.png" alt="">
            </div>
        </div>
        <div class="central">

            <!--Header-->

            <header>
                <h1>Messaggi</h1>
            </header>

            <div class="btn-header">

                <!-- Header Buttons-->
                <button class="btn-search">
                    <i class="bi bi-search"></i>
                </button>
                <button class="btn-add-friends">
                    <i class="bi bi-person-fill-add"></i>
                    Aggiungi Amici
                </button>
            </div>

        </div>
    </div>
</body>

</html>
